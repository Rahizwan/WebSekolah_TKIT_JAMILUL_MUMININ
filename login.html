<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | TKIT Jamilul Mu'minin</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background-color: #f9fafb;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .login-container {
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 400px;
      padding: 40px 30px;
      text-align: center;
    }

    .logo {
      width: 80px;
      height: 80px;
      object-fit: contain;
      margin-bottom: 10px;
    }

    h1 {
      font-size: 1.4rem;
      color: #1b5e20;
      font-weight: 700;
      line-height: 1.3;
    }

    h2 {
      font-size: 1.2rem;
      color: #2e7d32;
      font-weight: 600;
      margin-top: 5px;
    }

    .subtitle {
      color: #666;
      font-size: 0.9rem;
      margin: 10px 0 25px;
    }

    .form-group {
      text-align: left;
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      font-size: 0.9rem;
      font-weight: 600;
      color: #333;
      margin-bottom: 6px;
    }

    .form-group input {
      width: 100%;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 0.95rem;
      outline: none;
      transition: border 0.2s;
    }

    .form-group input:focus {
      border-color: #2e7d32;
    }

    .login-btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(90deg, #8bc34a, #cddc39);
      color: #fff;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.3s;
    }

    .login-btn:hover {
      background: linear-gradient(90deg, #7cb342, #c0ca33);
    }

    .register-box {
      margin-top: 25px;
      background: #f1f8e9;
      padding: 12px;
      border-radius: 10px;
      font-size: 0.9rem;
      color: #333;
    }

    .register-box a {
      color: #2e7d32;
      font-weight: 600;
      text-decoration: none;
    }

    .register-box a:hover {
      text-decoration: underline;
    }

    @media (max-width: 480px) {
      .login-container {
        padding: 30px 20px;
      }
    }
  </style>
</head>
<body>

  <div class="login-container">
    <img src="logo.png" alt="Logo TKIT Jamilul Mu'minin" class="logo">
    <h1>TKIT Jamilul Mu'minin</h1>
    <h2>Surabaya</h2>
    <p class="subtitle">Tahun Ajaran 2026/2027</p>

    <div class="form-group">
      <label for="username">Email / No HP / Username Orang Tua</label>
      <input type="text" id="username" placeholder="Masukkan username Anda">
    </div>

    <div class="form-group">
      <label for="password">Kata Sandi Akun Orang Tua</label>
      <input type="password" id="password" placeholder="Masukkan kata sandi">
    </div>

    <button class="login-btn">Masuk Akun Orang Tua</button>

    <div class="register-box">
      <p>Belum punya Akun Orang Tua?<br>
        Jika belum mendaftar, silakan klik tombol 
        <a href="#">Daftar Akun Orang Tua</a>.
      </p>
    </div>
  </div>

</body>
</html>
