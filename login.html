<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login TKIT Jamilul Mu'minin</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Poppins", "Segoe UI", sans-serif;
    }

    body {
      background: #f4f4f4;
      color: #333;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ===== Container utama ===== */
    .login-container {
      display: flex;
      flex-wrap: wrap;
      min-height: 100vh;
      width: 100%;
    }

    /* ===== Kiri (gambar) ===== */
    .login-left {
      flex: 1;
      position: relative;
      background: #e8f5e9;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* ===== Kanan (form login) ===== */
    .login-right {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff;
      padding: 2rem;
    }

    .login-box {
      width: 100%;
      max-width: 400px;
      text-align: center;
    }

    /* ===== Logo Sekolah ===== */
    .logo-image {
      width: 90px;        /* Ubah ukuran logo di sini */
      height: auto;
      margin-bottom: 10px;
    }

    .login-box h2 {
      color: #2d6016;
      font-size: 1.8rem;
      margin-bottom: 0.5rem;
    }

    .login-box p {
      color: #555;
      margin-bottom: 2rem;
    }

    /* ===== Input form ===== */
    label {
      font-weight: 600;
      display: block;
      margin-top: 1rem;
      color: #333;
      text-align: left;
    }

    input {
      width: 100%;
      padding: 0.8rem;
      margin-top: 0.5rem;
      border-radius: 8px;
      border: 1px solid #ccc;
      outline: none;
      font-size: 1rem;
    }

    input:focus {
      border-color: #4CAF50;
      box-shadow: 0 0 4px rgba(76, 175, 80, 0.3);
    }

    .btn-login {
      margin-top: 2rem;
      width: 100%;
      padding: 0.9rem;
      background: linear-gradient(135deg, #4CAF50, #FDD835);
      border: none;
      border-radius: 8px;
      color: white;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }

    .btn-login:hover {
      background: linear-gradient(135deg, #2d6016, #F9A825);
      transform: translateY(-2px);
    }

    /* ===== Tombol tambahan ===== */
    .extra-links {
      margin-top: 2rem;
    }

    .extra-links div {
      background: #fafafa;
      border: 1px solid #eee;
      border-radius: 8px;
      padding: 1rem;
      margin-bottom: 1rem;
      text-align: center;
    }

    .btn-outline {
      margin-top: 0.5rem;
      border: 2px solid #4CAF50;
      background: white;
      color: #4CAF50;
      font-weight: 600;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      cursor: pointer;
      transition: 0.3s;
    }

    .btn-outline:hover {
      background: #4CAF50;
      color: white;
    }

    /* ===== Responsif untuk tablet ===== */
    @media (max-width: 1024px) {
      .login-container {
        flex-direction: column;
      }

      .login-left {
        height: 40vh;
      }

      .login-right {
        height: auto;
        padding: 1.5rem;
      }

      .login-box {
        max-width: 90%;
      }
    }

    /* ===== Responsif untuk HP ===== */
    @media (max-width: 600px) {
      .login-box h2 {
        font-size: 1.4rem;
      }

      .logo-image {
        width: 70px; /* Logo otomatis mengecil di HP */
      }

      .login-box p {
        font-size: 0.9rem;
      }

      input, .btn-login, .btn-outline {
        font-size: 0.9rem;
        padding: 0.7rem;
      }

      .btn-login {
        margin-top: 1.5rem;
      }
    }
  </style>
</head>
<body>
  <div class="login-container">
    <!-- Kiri -->
    <div class="login-left">
      <img src="pulu pulu.jpg" alt="Siswa TKIT" class="login-image">
    </div>

    <!-- Kanan -->
    <div class="login-right">
      <div class="login-box">
        <img src="logo_tkit-removebg-preview.png" alt="logo Jamilul Mu'minin" class="logo-image">
        <h2>TKIT Jamilul Mu'minin</h2>
        <p>Tahun Ajaran 2025 / 2026</p>

        <form action="dashboardStatusPembayaran.html" method="POST">
          <label for="username">No HP / Username</label>
          <input type="text" id="username" placeholder="Masukkan username" required>

          <label for="password">password</label>
          <input type="password" id="password" placeholder="password" required>

          <button type="submit" class="btn-login">Masuk Halaman </button>
        </form>
          
        </div>
      </div>
    </div>
  </div>

  <script src="login.js"></script>
</body>
</html>
