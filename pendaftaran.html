<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pendaftaran TKIT Jamilul Mu’minin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6">

        <div class="card shadow-sm border-0">
          <div class="card-body p-4">

            <div class="text-center mb-4">
                <img src="logo_tkit-removebg-preview.png"
                    alt="Logo TKIT"
                    width="150"
                    class="mb-2 mt-2">
                <h4 class="fw-bold text-success mb-1">Formulir Pendaftaran Siswa Baru</h4>
                <p class="text-muted small mb-0">TKIT Jamilul Mu’minin</p>
                <p class="text-muted small mb-0">Mendidik Anak Kreatif, Mandiri & Berakhlakul Kharimah</p>
            </div>


            <form>
              <!-- Nama Anak -->
              <div class="mb-3">
                <label for="namaAnak" class="form-label">Nama Lengkap Calon Siswa</label>
                <input type="text" class="form-control" id="namaAnak" placeholder="Masukkan nama lengkap calon siswa" required>
              </div>

              <!-- Tanggal Lahir -->
              <div class="mb-3">
                <label for="tanggalLahir" class="form-label">Tanggal Lahir</label>
                <input type="date" class="form-control" id="tanggalLahir" required>
              </div>

              <!-- Tempat Lahir -->
              <div class="mb-3">
                <label for="tempatLahir" class="form-label">Tempat Lahir</label>
                <input type="text" class="form-control" id="tempatLahir" placeholder="Masukkan tempat lahir calon siswa" required>
              </div>

              <!-- Agama -->
                <div class="mb-3">
                <label for="agama" class="form-label">Agama</label>
                  <select class="form-select" id="agama" required>
                    <option selected disabled>Pilih agama</option>
                    <option value="Islam">Islam</option>
                    <option value="Kristen">Kristen</option>
                    <option value="Katolik">Katolik</option>
                    <option value="Hindu">Hindu</option>
                    <option value="Buddha">Buddha</option>
                    <option value="Konghucu">Konghucu</option>
                  </select>
                </div>

              <!-- Anak Ke -->
              <div class="mb-3">
                <label for="anakKe" class="form-label">Anak Ke-</label>
                <input type="number" class="form-control" id="anakKe" placeholder="Contoh: 2" required>
              </div>


              <!-- Jenis Kelamin -->
              <div class="mb-3">
                <label for="jenisKelamin" class="form-label">Jenis Kelamin</label>
                <select class="form-select" id="jenisKelamin" required>
                  <option selected disabled>Pilih jenis kelamin</option>
                  <option value="Laki-laki">Laki-laki</option>
                  <option value="Perempuan">Perempuan</option>
                </select>
              </div>



              <!-- Data Orang Tua Lengkap -->
              <div class="mb-3">
                <label class="form-label fw-semibold">Data Orang Tua / Wali</label>
                <div class="row g-3">
                    <div class="col-md-6">
                      <label for="namaAyah" class="form-label">Nama Ayah</label>
                      <input type="text" class="form-control" id="namaAyah" placeholder="Nama Ayah" required>
                    </div>

                    <div class="col-md-6">
                      <label for="pekerjaanAyah" class="form-label">Pekerjaan Ayah</label>
                      <input type="text" class="form-control" id="pekerjaanAyah" placeholder="Pekerjaan Ayah" required>
                    </div>
                </div>

                <div class="row g-3 mt-1">
                    <div class="col-md-6">
                      <label for="namaIbu" class="form-label">Nama Ibu</label>
                      <input type="text" class="form-control" id="namaIbu" placeholder="Nama Ibu" required>
                    </div>

                    <div class="col-md-6">
                      <label for="pekerjaanIbu" class="form-label">Pekerjaan Ibu</label>
                      <input type="text" class="form-control" id="pekerjaanIbu" placeholder="Pekerjaan Ibu" required>
                    </div>
                </div>
              </div>

              <!-- Nomor Telepon -->
              <div class="mb-3">
                <label for="telepon" class="form-label">Nomor Telepon Aktif</label>
                <input type="tel" class="form-control" id="telepon" placeholder="08xxxxxxxxxx" required>
              </div>

              <!-- Alamat -->
                <div class="mb-3">
                <label for="alamat" class="form-label">Alamat Lengkap</label>
                <textarea class="form-control mb-3" id="alamat" rows="2" placeholder="Nama jalan, nomor rumah, perumahan, dll." required></textarea>

                <div class="row g-3">
                    <div class="col-md-3">
                    <label for="rt" class="form-label">RT</label>
                    <input type="text" class="form-control" id="rt" placeholder="03" required>
                    </div>
                    <div class="col-md-3">
                    <label for="rw" class="form-label">RW</label>
                    <input type="text" class="form-control" id="rw" placeholder="07" required>
                    </div>
                    <div class="col-md-6">
                    <label for="kelurahan" class="form-label">Kelurahan</label>
                    <input type="text" class="form-control" id="kelurahan" placeholder="Masukkan kelurahan" required>
                    </div>
                </div>

                <div class="row g-3 mt-1">
                    <div class="col-md-6">
                    <label for="kecamatan" class="form-label">Kecamatan</label>
                    <input type="text" class="form-control" id="kecamatan" placeholder="Masukkan kecamatan" required>
                    </div>
                    <div class="col-md-4">
                    <label for="kota" class="form-label">Kota / Kabupaten</label>
                    <input type="text" class="form-control" id="kota" placeholder="Masukkan kota" required>
                    </div>
                    <div class="col-md-2">
                    <label for="kodePos" class="form-label">Kode Pos</label>
                    <input type="text" class="form-control" id="kodePos" placeholder="60233" required>
                    </div>
                </div>
                </div>


                <!-- Program Kelas -->
                <div class="mb-3">
                    <label class="form-label fw-semibold">Pilihan Program Kelas</label>
                <div class="row g-3">

                <div class="mb-3">
                    <label for="programKelas" class="form-label">Program Kelas</label>
                    <select class="form-select" id="programKelas" required>
                    <option selected disabled>Pilih program kelas</option>
                    <option value="Kelompok A (Usia 4-5 Tahun)">Kelompok A (Usia 4-5 Tahun)</option>
                    <option value="Kelompok B (Usia 5-6 Tahun)">Kelompok B (Usia 5-6 Tahun)</option>
                    </select>
                </div>

                <!-- Catatan Tambahan -->
                <div class="mb-3">
                    <label for="catatan" class="form-label">Catatan Tambahan (opsional)</label>
                    <textarea class="form-control" id="catatan" rows="2" placeholder="Contoh: Alergi makanan, kondisi khusus, dsb."></textarea>
                </div>

                <!-- Pernyataan Kebenaran Data -->
                <div class="form-check mb-4">
                  <input class="form-check-input" type="checkbox" value="" id="pernyataan" required>
                  <label class="form-check-label" for="pernyataan">
                    Saya menyatakan bahwa data yang saya isi di atas adalah <strong>benar dan sesuai dengan keadaan sebenarnya</strong>.
                  </label>
                </div>


                <!-- Tombol Submit -->
                <div class="d-grid gap-2"> <!-- Mengubah mb-3 menjadi gap-2 untuk jarak antar tombol -->
                    <button type="submit" class="btn btn-success btn-lg">Kirim Pendaftaran</button>
                    <!-- Tombol untuk pergi ke login.html -->
                    <a href="login.html" class="btn btn-outline-secondary btn-sm">Sudah punya akun? Login di sini</a>
                </div>
                </form>

            </div>
            </div>

        </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
